# Builds, analyzes, and tests the Flutter app, then produces an APK.
# - Push to master / PR: verify + upload APK as a run artifact.
# - Tag v* (e.g. v0.1.0): attach the APK to a GitHub Release for direct
#   phone download (no login needed).
# Manual trigger also available from the Actions tab (workflow_dispatch).

name: build-apk

"on":
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # needed to publish GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Gradle requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.6 (matches local dev)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (includes golden previews)
        run: flutter test

      - name: Build release APK (debug-signed, internal distribution)
        run: flutter build apk --release

      - name: Rename APK with ref name
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/neu-controller-${TAG}.apk"

      - name: Upload APK artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: neu-controller-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
